<div class="ngc-file-picker__header" *ngIf="mode !== 'inline'">
	<div class="ngc-file-picker__header-title">
		{{ 'WGC.LABEL.UPLOAD_FILE' | translate }}
	</div>
	<button
		ngcBasicButton
		icon="close"
		[ngcTooltip]="'WGC.LABEL.CLOSE' | translate"
		(click)="close()">
	</button>
</div>

<div class="ngc-file-picker__label">
	{{ 'WGC.LABEL.FROM' | translate }}
</div>

<button
	class="ngc-file-picker__option"
	ngcBasicButton
	[disabled]="isUploading"
	(click)="filePickerInput?.click()">
	<ngc-icon class="ngc-file-picker__option-icon" name="document" size="20px"></ngc-icon>
	{{ 'WGC.LABEL.YOUR_COMPUTER' | translate }}
	({{ 'WGC.LABEL.MAX' | translate }}: {{ maxFileSize | fileSize }})
</button>

<button
	class="ngc-file-picker__option"
	ngcBasicButton
	ngcGoogleDrivePicker
	*ngIf="cloudStorageConfig?.googleDrive"
	[disabled]="isUploading"
	[mimeTypes]="googleDriveMimeTypes"
	[multiSelect]="multiSelect"
	(picked)="onGoogleDrivePicked($event)">
	<img class="ngc-file-picker__option-icon" width="20px" height="20px" [lazyLoad]="'assets/images/icons/google-drive.png'" />
	Google Drive
</button>

<button
	class="ngc-file-picker__option"
	ngcBasicButton
	ngcDropboxPicker
	*ngIf="cloudStorageConfig?.dropbox"
	[disabled]="isUploading"
	[extensions]="dropboxExtensions"
	[multiSelect]="multiSelect"
	(picked)="onDropboxPicked($event)">
	<img class="ngc-file-picker__option-icon" width="20px" height="20px" [lazyLoad]="'assets/images/icons/dropbox.png'" />
	Dropbox
</button>

<button
	class="ngc-file-picker__option"
	ngcBasicButton
	ngcOneDrivePicker
	*ngIf="cloudStorageConfig?.oneDrive"
	[disabled]="isUploading"
	[extensions]="oneDriveExtensions"
	[multiSelect]="multiSelect"
	(picked)="onOneDrivePicked($event)">
	<img class="ngc-file-picker__option-icon" width="20px" height="20px" [lazyLoad]="'assets/images/icons/one-drive.png'" />
	OneDrive
</button>

<div class="ngc-file-picker__label">
	{{ 'WGC.LABEL.OR_DROP_FILE_HERE' | translate }}
</div>

<div class="ngc-file-picker__upload-list" *ngIf="uploadingFiles; else elseBlock">
	<div class="ngc-file-picker__upload-list-item" *ngFor="let file of uploadingFiles; let index = index;">
		<img class="ngc-file-picker__upload-list-item__icon" width="24px" [lazyLoad]="file?.name | fileIcon" />
		<div class="ngc-file-picker__upload-list-item__info">
			<ngc-truncate class="ngc-file-picker__upload-list-item__info-name" [limitLine]="1">
				{{ file?.name | empty }}
			</ngc-truncate>
			<div class="ngc-file-picker__upload-list-item__info-size">
				{{ file?.size | fileSize }}
			</div>
		</div>
		<div class="ngc-file-picker__upload-list-item__loading">
			<ng-container *ngIf="uploadingFileStates[index]?.success === undefined; else elseStateBlock">
				<round-progress
					[stroke]="1.5"
					[radius]="11"
					[color]="'INFO' | color"
					[background]="'PLACEHOLDER' | color"
					[current]="uploadingFileStates[index]?.loaded || 0"
					[max]="uploadingFileStates[index]?.total || 100">
				</round-progress>
			</ng-container>
			<ng-template #elseStateBlock>
				<ngc-icon
					size="24px"
					[name]="uploadingFileStates[index]?.success ? 'check' : 'warning'"
					[color]="(uploadingFileStates[index]?.success ? 'SUCCESS' : 'WARNING') | color">
				</ngc-icon>
			</ng-template>
		</div>
	</div>
</div>

<ng-template #elseBlock>
	<div
		class="ngc-file-picker__dropzone"
		(dragover)="$event?.stopPropagation(); $event?.preventDefault()"
		(drop)="$event?.preventDefault(); onLocalPicked($event?.dataTransfer?.files)">
		<ngc-icon name="cloud-upload" size="48px"></ngc-icon>
	</div>
</ng-template>

<input
	#filePickerInput
	type="file"
	tabindex="-1"
	style="display: none"
	[disabled]="isUploading"
	[attr.multiple]="multiSelect || undefined"
	[attr.accept]="fileAccept"
	(change)="onLocalPicked($any($event?.target)?.files); filePickerInput.value = ''" />

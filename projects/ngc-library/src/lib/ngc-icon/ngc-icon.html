<ng-container *ngIf="isIonic; else icomoonBlock">
  <ion-icon 
    [name]="ionicIconName"
    [style.color]="styleColor"
    [style.font-size]="styleFontSize"
    [style.width]="styleWidth"
    [style.height]="styleHeight">
  </ion-icon>
</ng-container>
<ng-template #icomoonBlock>
  <!-- Icomoon icon font (local) -->
  <i [ngClass]="iconClass"
     [style.color]="styleColor"
     [style.font-size]="styleFontSize"
     [style.line-height]="styleLineHeight">
  </i>
</ng-template>

<div class="guideline-header-bar">
	<div class="header-logo" (click)="onLogoClick()" style="cursor: pointer;">
		<img src="assets/images/logos/logo.png" alt="Logo" class="logo-image" />
	</div>
	<div class="header-menu">
		<button ngcButton class="menu-btn" routerLink="/sketch">Mobile Sketch</button>
		<button ngcButton class="menu-btn" routerLink="/contact">Contact</button>
		<button ngcButton class="menu-btn dark-mode-btn" (click)="toggleDarkMode()" [title]="isDarkMode ? 'Light Mode' : 'Dark Mode'">
			<ngc-icon [name]="isDarkMode ? 'sunny' : 'moon'" size="16px"></ngc-icon>
		</button>
	</div>
</div>

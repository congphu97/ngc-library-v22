<div class="guideline-header-bar">
	<!-- LEFT LOGO & BRAND -->
	<div class="header-left">
		<div class="header-logo" (click)="onLogoClick()" style="cursor: pointer;" title="Back to Overview">
			<img src="assets/images/logos/logo.png" alt="Logo" class="logo-image" />
			<span class="header-brand-title">NGC Library</span>
		</div>
	</div>

	<!-- CENTER SEARCH BAR -->
	<div class="header-search-container" #searchContainer>
		<div class="header-search-wrap" [class.focused]="isDropdownOpen">
			<svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<circle cx="11" cy="11" r="8"></circle>
				<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
			</svg>
			<input
				#searchInput
				type="text"
				class="header-search-input"
				placeholder="Search 65+ components... (⌘K)"
				[(ngModel)]="searchQuery"
				(input)="onSearchInput()"
				(focus)="onSearchFocus()"
				(keydown)="onSearchKeydown($event)"
				autocomplete="off"
				spellcheck="false"
			/>
			<div class="search-trailing">
				<button 
					*ngIf="searchQuery" 
					class="clear-search-btn" 
					(click)="clearSearch($event)" 
					type="button" 
					title="Clear search">
					<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
				</button>
				<span class="shortcut-badge" *ngIf="!searchQuery">⌘K</span>
			</div>
		</div>

		<!-- FLOATING SEARCH RESULTS DROPDOWN -->
		<div class="search-dropdown-menu" *ngIf="isDropdownOpen && filteredResults.length > 0">
			<div class="dropdown-header">
				<span class="results-count">{{ filteredResults.length }} components found</span>
				<span class="keyboard-hints">↑↓ Navigate · ↵ Select · Esc Close</span>
			</div>
			<div class="results-list">
				<div
					*ngFor="let item of filteredResults; let i = index"
					class="search-result-item"
					[class.highlighted]="i === selectedIndex"
					(click)="onSelectResult(item)"
					(mouseenter)="selectedIndex = i"
				>
					<div class="result-icon-box">
						<ngc-icon [name]="item.icon" size="16px"></ngc-icon>
					</div>
					<div class="result-details">
						<div class="result-top">
							<span class="result-name">{{ item.name }}</span>
							<span class="result-category-badge">{{ item.category }}</span>
						</div>
						<div class="result-desc" *ngIf="item.desc">{{ item.desc }}</div>
					</div>
					<svg class="result-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
				</div>
			</div>
		</div>

		<!-- NOT FOUND DROPDOWN STATE -->
		<div class="search-dropdown-menu not-found" *ngIf="isDropdownOpen && searchQuery.trim() && filteredResults.length === 0">
			<div class="not-found-content">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
				<p>No components found for "<strong>{{ searchQuery }}</strong>"</p>
				<span>Try searching for Button, Table, Dialog, Input, Tabs...</span>
			</div>
		</div>
	</div>

	<!-- RIGHT MENU -->
	<div class="header-menu">
		<button ngcButton class="menu-btn" routerLink="/sketch">Sketch Studio</button>
		<button ngcButton class="menu-btn" routerLink="/contact">Contact</button>
		<button ngcButton class="menu-btn dark-mode-btn" (click)="toggleDarkMode()" [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
			<!-- Sun Icon (displayed in Dark Mode to switch to Light) -->
			<svg *ngIf="isDarkMode" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon sun-icon">
				<circle cx="12" cy="12" r="5"></circle>
				<line x1="12" y1="1" x2="12" y2="3"></line>
				<line x1="12" y1="21" x2="12" y2="23"></line>
				<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
				<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
				<line x1="1" y1="12" x2="3" y2="12"></line>
				<line x1="21" y1="12" x2="23" y2="12"></line>
				<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
				<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
			</svg>
			<!-- Moon Icon (displayed in Light Mode to switch to Dark) -->
			<svg *ngIf="!isDarkMode" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon moon-icon">
				<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
			</svg>
		</button>
	</div>
</div>
